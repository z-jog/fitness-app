<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FitMate 健身打卡</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #111827; min-height: 100vh; display: flex; justify-content: center; align-items: center;
      transition: background 0.3s;
    }
    #app {
      width: 100%; max-width: 420px; min-height: 100vh; min-height: 100dvh; background: #1f2937;
      position: relative; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(0,0,0,0.6);
      transition: background 0.3s;
    }
    #auth-screen {
      flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 32px 24px; animation: fadeIn 0.4s ease;
    }
    #auth-screen.hidden { display: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .auth-card { background: #374151; border-radius: 24px; padding: 32px 24px; width: 100%; box-shadow: 0 8px 32px rgba(0,0,0,0.35); }
    .logo-icon { width: 56px; height: 56px; background: #a3e635; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 28px; }
    .auth-title { font-size: 24px; font-weight: 700; color: #f9fafb; text-align: center; }
    .auth-sub { color: #9ca3af; text-align: center; font-size: 14px; margin-top: 4px; margin-bottom: 28px; }
    .input-label { color: #d1d5db; font-size: 13px; font-weight: 600; margin-bottom: 6px; display: block; }
    .nickname-input { width: 100%; padding: 14px 16px; background: #4b5563; border: 2px solid #6b7280; border-radius: 14px; color: #f9fafb; font-size: 16px; outline: none; transition: border-color 0.2s; }
    .nickname-input:focus { border-color: #a3e635; }
    .nickname-input::placeholder { color: #6b7280; }
    .avatar-label { color: #d1d5db; font-size: 13px; font-weight: 600; margin-top: 24px; margin-bottom: 12px; display: block; }
    .avatar-grid { display: flex; gap: 16px; justify-content: center; }
    .avatar-option { width: 64px; height: 64px; border-radius: 50%; background: #4b5563; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; border: 3px solid transparent; transition: all 0.2s; }
    .avatar-option:hover { border-color: #9ca3af; }
    .avatar-option.selected { border-color: #a3e635; background: #3f6212; box-shadow: 0 0 16px rgba(163,230,53,0.35); }
    .btn-start { width: 100%; margin-top: 32px; padding: 16px; background: #a3e635; color: #111827; font-size: 17px; font-weight: 700; border: none; border-radius: 14px; cursor: pointer; transition: background 0.2s, transform 0.15s; }
    .btn-start:hover { background: #84cc16; }
    .btn-start:active { transform: scale(0.97); }
    .btn-start:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    #main-screen { flex: 1; display: none; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
    #main-screen.active { display: flex; }
    .top-bar { padding: 16px 20px 12px; display: flex; align-items: center; justify-content: space-between; background: #1f2937; border-bottom: 1px solid #374151; flex-shrink: 0; }
    .top-bar-left { display: flex; align-items: center; gap: 10px; }
    .top-bar-avatar { width: 36px; height: 36px; border-radius: 50%; background: #4b5563; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .top-bar-name { color: #f9fafb; font-weight: 600; font-size: 15px; }
    .top-bar-badge { background: #a3e635; color: #111827; font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 10px; }
    .content-area { flex: 1; overflow-y: auto; padding: 20px; }
    .tab-page { display: none; animation: fadeIn 0.3s ease; }
    .tab-page.active { display: block; }
    .checkin-card { background: #374151; border-radius: 20px; padding: 24px; margin-bottom: 16px; }
    .checkin-card h3 { color: #f9fafb; font-size: 18px; font-weight: 700; margin-bottom: 12px; }
    .streak-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .streak-num { font-size: 36px; font-weight: 800; color: #a3e635; }
    .streak-label { color: #9ca3af; font-size: 13px; }

    .sport-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
    .sport-item { background: #4b5563; border-radius: 14px; padding: 12px 4px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; user-select: none; }
    .sport-item:hover { border-color: #6b7280; }
    .sport-item.selected { border-color: #a3e635; background: #3f6212; box-shadow: 0 0 12px rgba(163,230,53,0.25); }
    .sport-item .sport-emoji { font-size: 24px; display: block; line-height: 1.2; }
    .sport-item .sport-name { font-size: 11px; color: #d1d5db; margin-top: 4px; display: block; font-weight: 500; }
    .sport-item.selected .sport-name { color: #f9fafb; }

    .dynamic-form { animation: fadeIn 0.3s ease; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; color: #d1d5db; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .form-input { width: 100%; padding: 12px 14px; background: #4b5563; border: 2px solid #6b7280; border-radius: 12px; color: #f9fafb; font-size: 15px; outline: none; transition: border-color 0.2s; }
    .form-input:focus { border-color: #a3e635; }
    .form-input::placeholder { color: #6b7280; }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }

    .body-part-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .body-part-tab { padding: 8px 16px; background: #4b5563; border-radius: 20px; color: #d1d5db; font-size: 13px; font-weight: 600; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; user-select: none; }
    .body-part-tab:hover { border-color: #6b7280; }
    .body-part-tab.active { border-color: #a3e635; background: #3f6212; color: #f9fafb; }

    .exercise-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .exercise-card { background: #4b5563; border-radius: 14px; padding: 12px 6px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: all 0.25s; user-select: none; }
    .exercise-card:hover { border-color: #6b7280; }
    .exercise-card.selected { border-color: #a3e635; background: #3f6212; box-shadow: 0 0 16px rgba(163,230,53,0.3); }
    .exercise-demo { width: 56px; height: 56px; margin: 0 auto 6px; border-radius: 12px; border: 2px solid #a3e635; background: #1f2937; display: flex; align-items: center; justify-content: center; font-size: 26px; animation: demoPulse 3s ease-in-out infinite; position: relative; overflow: hidden; }
    @keyframes demoPulse { 0%,100% { box-shadow: 0 0 4px rgba(163,230,53,0.2); transform: scale(1); } 50% { box-shadow: 0 0 16px rgba(163,230,53,0.5); transform: scale(1.04); } }
    .exercise-demo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(163,230,53,0.08) 0%, transparent 50%); border-radius: 10px; }
    .exercise-card .exercise-label { font-size: 11px; color: #d1d5db; font-weight: 500; line-height: 1.2; }
    .exercise-card.selected .exercise-label { color: #f9fafb; }

    .mood-grid { display: flex; gap: 12px; justify-content: center; margin-bottom: 16px; }
    .mood-item { width: 48px; height: 48px; border-radius: 50%; background: #4b5563; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; user-select: none; }
    .mood-item:hover { border-color: #6b7280; }
    .mood-item.selected { border-color: #a3e635; background: #3f6212; }

    .privacy-toggle { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 16px; }
    .privacy-toggle span { color: #9ca3af; font-size: 13px; }
    .privacy-toggle .privacy-label-active { color: #a3e635; font-weight: 600; }
    .toggle-switch { width: 48px; height: 26px; background: #4b5563; border-radius: 13px; cursor: pointer; position: relative; transition: background 0.25s; flex-shrink: 0; }
    .toggle-switch.active { background: #a3e635; }
    .toggle-switch::after { content: ''; position: absolute; width: 22px; height: 22px; background: #f9fafb; border-radius: 50%; top: 2px; left: 2px; transition: transform 0.25s; }
    .toggle-switch.active::after { transform: translateX(22px); }

    .btn-confirm-checkin { width: 100%; padding: 16px; background: #a3e635; color: #111827; font-size: 17px; font-weight: 700; border: none; border-radius: 14px; cursor: pointer; transition: background 0.2s, transform 0.15s; margin-top: 8px; }
    .btn-confirm-checkin:active { transform: scale(0.97); }
    .btn-confirm-checkin:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ── 圈子 ── 朋友圈卡片 ── */
    .circle-top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .circle-top-bar h2 { color: #f9fafb; font-size: 20px; font-weight: 700; }
    .notif-badge-wrap { position: relative; }
    .notif-badge {
      position: absolute; top: -6px; right: -10px;
      background: #ef4444; color: #fff; font-size: 11px; font-weight: 700;
      min-width: 20px; height: 20px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 4px; box-shadow: 0 0 8px rgba(239,68,68,0.5);
      cursor: pointer; transition: transform 0.2s;
    }
    .notif-badge:active { transform: scale(0.9); }
    .notif-badge.hidden { display: none; }

    .post-card { background: #374151; border-radius: 18px; padding: 18px; margin-bottom: 14px; }
    .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .post-avatar { width: 38px; height: 38px; border-radius: 50%; background: #4b5563; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .post-author { color: #f9fafb; font-weight: 600; font-size: 14px; }
    .post-time { color: #6b7280; font-size: 11px; }
    .post-sport { font-size: 13px; margin: 4px 0 8px; }
    .post-sport .sport-tag { color: #a3e635; font-weight: 600; }
    .post-data { color: #9ca3af; font-size: 13px; line-height: 1.6; margin-bottom: 8px; }
    .post-mood { font-size: 16px; margin-top: 4px; }

    .post-actions { display: flex; gap: 24px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #4b5563; }
    .action-btn { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #9ca3af; font-size: 13px; user-select: none; transition: color 0.2s; }
    .action-btn:active { transform: scale(0.95); }
    .action-btn.liked { color: #ef4444; }
    .action-btn.liked .heart-icon { color: #ef4444; }

    .post-comments { margin-top: 10px; border-top: 1px solid #4b5563; padding-top: 8px; }
    .comment-item { color: #d1d5db; font-size: 13px; padding: 4px 0; line-height: 1.5; cursor: pointer; }
    .comment-author { color: #a3e635; font-weight: 600; }
    .comment-reply-to { color: #6b7280; font-weight: 400; }
    .reply-text { color: #a3e635; font-weight: 600; font-size: 12px; }
    .comment-text { color: #d1d5db; }
    .comment-show-btn { color: #6b7280; font-size: 13px; cursor: pointer; margin-top: 4px; }
    .comment-show-btn:hover { color: #9ca3af; }

    .comment-input-wrap { display: flex; gap: 8px; margin-top: 8px; }
    .comment-input { flex: 1; padding: 10px 14px; background: #4b5563; border: 2px solid #6b7280; border-radius: 20px; color: #f9fafb; font-size: 13px; outline: none; transition: border-color 0.2s; }
    .comment-input:focus { border-color: #a3e635; }
    .comment-input::placeholder { color: #6b7280; }
    .comment-send { width: 36px; height: 36px; border-radius: 50%; background: #a3e635; color: #111827; border: none; font-size: 16px; cursor: pointer; flex-shrink: 0; }
    .comment-send:active { background: #84cc16; }

    /* ── 通知面板 ── */
    .notif-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 998; display: none; animation: fadeIn 0.2s ease; }
    .notif-overlay.show { display: block; }
    .notif-panel {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%);
      width: 100%; max-width: 420px; background: rgba(31,41,55,0.92);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-radius: 20px 20px 0 0; z-index: 999; padding: 20px;
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
      max-height: 70vh; overflow-y: auto;
    }
    .notif-panel.show { transform: translateX(-50%) translateY(0); }
    .notif-panel h3 { color: #f9fafb; font-size: 18px; font-weight: 700; margin-bottom: 16px; }
    .notif-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(75,85,99,0.5); color: #d1d5db; font-size: 13px; line-height: 1.5; }
    .notif-item:last-child { border-bottom: none; }
    .notif-icon { font-size: 20px; flex-shrink: 0; }
    .notif-read-all { margin-top: 12px; padding: 10px; background: #a3e635; color: #111827; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; }
    .notif-read-all:active { background: #84cc16; }

    .nav-dot { position: absolute; top: 2px; right: calc(50% - 22px); width: 8px; height: 8px; background: #ef4444; border-radius: 50%; display: none; box-shadow: 0 0 6px rgba(239,68,68,0.6); }
    .nav-dot.show { display: block; }

    .placeholder-card { background: #374151; border-radius: 20px; padding: 40px 24px; text-align: center; }
    .placeholder-icon { font-size: 48px; margin-bottom: 16px; }
    .placeholder-title { color: #f9fafb; font-size: 18px; font-weight: 600; }
    .placeholder-desc { color: #6b7280; font-size: 14px; margin-top: 6px; }

    .bottom-nav { background: #111827; border-top: 1px solid #374151; display: flex; padding: 6px 0 env(safe-area-inset-bottom, 6px) 0; flex-shrink: 0; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 0; cursor: pointer; color: #6b7280; transition: color 0.2s; user-select: none; }
    .nav-item .nav-icon { font-size: 22px; line-height: 1; }
    .nav-item .nav-label { font-size: 10px; margin-top: 2px; font-weight: 500; }
    .nav-item.active { color: #a3e635; }

    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-80px); background: #374151; color: #f9fafb; padding: 12px 24px; border-radius: 12px; font-size: 14px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.4); max-width: 360px; width: calc(100% - 40px); text-align: center; z-index: 999; transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1); pointer-events: none; }
    .toast.show { transform: translateX(-50%) translateY(0); }

    .content-area::-webkit-scrollbar { width: 4px; }
    .content-area::-webkit-scrollbar-track { background: transparent; }
    .content-area::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }

    /* ── 📊 亮色皮肤全环境平滑反转矩阵样式 ── */
    .light-theme-active { background: #f3f4f6 !important; }
    .light-theme-active #app { background: #f9fafb !important; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    .light-theme-active .checkin-card, .light-theme-active .post-card, .light-theme-active .auth-card { background: #ffffff !important; border: 1px solid #e5e7eb !important; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05) !important; }
    .light-theme-active h2, .light-theme-active h3, .light-theme-active h4, .light-theme-active .top-bar-name, .light-theme-active .auth-title { color: #111827 !important; }
    .light-theme-active span, .light-theme-active label, .light-theme-active .post-data, .light-theme-active .streak-label { color: #4b5563 !important; }
    .light-theme-active .sport-item, .light-theme-active .body-part-tab, .light-theme-active .exercise-card, .light-theme-active .comment-input, .light-theme-active .nickname-input, .light-theme-active .avatar-option, .light-theme-active select { background: #f3f4f6 !important; color: #111827 !important; border-color: #d1d5db !important; }
    .light-theme-active .sport-item.selected, .light-theme-active .body-part-tab.active, .light-theme-active .exercise-card.selected, .light-theme-active .avatar-option.selected { background: #ecfccb !important; border-color: #84cc16 !important; }
    .light-theme-active .bottom-nav, .light-theme-active .top-bar { background: #ffffff !important; border-color: #e5e7eb !important; }
    .light-theme-active .rank-btn { background: #374151; color: #f9fafb; }
    .light-theme-active .rank-btn.active { background: #a3e635; color: #111827; }
    .light-theme-active .cal-day { color: #4b5563; }
    .light-theme-active .cal-day.has-data { background: #ecfccb !important; color: #3f6212 !important; font-weight: 700; }
  </style>
</head>
<body>

<div id="app">

  <div id="toast" class="toast"></div>

  <div id="auth-screen">
    <div class="auth-card">
      <div class="logo-icon">💪</div>
      <div id="lblAuthTitle" class="auth-title">FitMate</div>
      <div id="lblAuthSub" class="auth-sub">健身打卡 · 遇见更好的自己</div>

      <label id="lblNickLabel" class="input-label" for="nickname">你的昵称</label>
      <input
        id="nickname"
        class="nickname-input"
        type="text"
        placeholder="输入昵称..."
        maxlength="12"
        autocomplete="off"
      />

      <span id="lblAvatarLabel" class="avatar-label">选择头像</span>
      <div class="avatar-grid" id="avatarGrid">
        <div class="avatar-option" data-avatar="🏃">🏃</div>
        <div class="avatar-option" data-avatar="🏋️">🏋️</div>
        <div class="avatar-option" data-avatar="🧘">🧘</div>
      </div>

      <button class="btn-start" id="btnStart" disabled>开启健身之旅</button>
    </div>
  </div>

  <div id="main-screen">

    <div class="top-bar">
      <div class="top-bar-left">
        <div class="top-bar-avatar" id="topAvatar">🏃</div>
        <span class="top-bar-name" id="topName">用户</span>
      </div>
      <span class="top-bar-badge" id="mainStreakBadge">🔥 连续 0 天</span>
    </div>

    <div class="content-area" id="contentArea">

      <div class="tab-page active" id="page-checkin">

        <div style="display:none;"><span id="streakNum">0</span><button id="btnCheckin"></button><div id="checkinTime"></div></div>

        <div class="checkin-card">
          <h3 id="lblSelectSport">🏋️ 选择运动</h3>
          <div class="sport-grid" id="sportGrid"></div>
        </div>

        <div class="checkin-card" id="dynamicFormCard" style="display:none;">
          <h3 id="formTitle">📋 运动详情</h3>
          <div id="dynamicFormContent"></div>
        </div>

        <div class="checkin-card" id="extraCard" style="display:none;">
          <h3 id="lblTodayMood">😊 今日状态</h3>
          <div class="mood-grid" id="moodGrid">
            <div class="mood-item" data-mood="😄">😄</div>
            <div class="mood-item" data-mood="😮‍💨">😮‍💨</div>
            <div class="mood-item" data-mood="💪">💪</div>
          </div>
          <div class="privacy-toggle">
            <span id="lblPrivSelf">🔒 仅自己可见</span>
            <div class="toggle-switch active" id="privacyToggle"></div>
            <span id="lblPrivAll">🌍 所有人可见</span>
          </div>
          <button class="btn-confirm-checkin" id="btnConfirmCheckin" disabled>💾 确认打卡</button>
        </div>

      </div>

      <div class="tab-page" id="page-circle">
        <div class="circle-top-bar">
          <h2 id="lblTabCircle">🌐 运动圈子</h2>
          <div class="notif-badge-wrap">
            <span class="notif-badge hidden" id="notifBadge">0</span>
          </div>
        </div>
        <div id="circleFeed"></div>
      </div>

      <div class="tab-page" id="page-rank">
        <div class="flex flex-wrap gap-1.5 mb-4 justify-between" id="rankTabs">
          <button class="rank-btn flex-1 py-2 text-[11px] font-bold rounded-lg bg-lime-400 text-gray-900 active" data-rep="3.1" id="lblRep1">时长榜</button>
          <button class="rank-btn flex-1 py-2 text-[11px] font-bold rounded-lg bg-gray-700 text-white" data-rep="3.2" id="lblRep2">次数榜</button>
          <button class="rank-btn flex-1 py-2 text-[11px] font-bold rounded-lg bg-gray-700 text-white" data-rep="3.3" id="lblRep3">跑步榜</button>
        </div>
        
        <div class="mb-4" id="rankFilterRow">
          <select id="rankSportSelector" class="w-full p-2.5 bg-gray-600 text-white text-sm rounded-xl border border-gray-500 outline-none focus:border-lime-400"></select>
        </div>

        <div class="checkin-card" style="padding: 16px;">
          <div class="flex justify-between border-b border-gray-600 pb-2 text-xs text-gray-400 font-bold mb-3">

  function validate() {
    if (!selectedSport) { btnConfirm.disabled = true; return; }
    var t = selectedSport.type, ok = true;
    if (t === 'distance') { 
      var a = dynFormContent.querySelector('.dist-dur'), b = dynFormContent.querySelector('.dist-dist'); 
      if (!a || !b || !a.value.trim() || !b.value.trim() || parseFloat(a.value) <= 0 || parseFloat(b.value) <= 0) ok = false; 
    }
    else if (t === 'anaerobic') { 
      if (!selectedBodyPart) ok = false; 
      if (ok) { 
        var a = dynFormContent.querySelector('.ana-dur'); 
        if (!a || !a.value.trim() || parseFloat(a.value) <= 0) ok = false; 
      } 
    }
    else { 
      var a = dynFormContent.querySelector('.norm-dur'); 
      if (!a || !a.value.trim() || parseFloat(a.value) <= 0) ok = false; 
    }
    btnConfirm.disabled = !ok;

    var ed = { emoji: s.emoji, name: s.name, type: s.type };

    else if (t === 'anaerobic') { ed.bodyPart = selectedBodyPart; ed.duration = parseFloat(dynFormContent.querySelector('.ana-dur').value); }
    else { ed.duration = parseFloat(dynFormContent.querySelector('.norm-dur').value); }

        created_at: new Date().toISOString() 
      };

      var tempId = 'temp_' + Date.now();
      var localPostMock = Object.assign({}, cloudPost, { id: tempId });
      var localPosts = ls('fitmate_local_posts', []);
      localPosts.unshift(localPostMock);
      lss('fitmate_local_posts', localPosts);
      await renderCircle(); 

      var liveSavedData = await sbInsertPost(cloudPost);
      if (liveSavedData && liveSavedData.id) {
        syncSuccess = true;
        var currentLocals = ls('fitmate_local_posts', []);
        var idx = currentLocals.findIndex(function(lp) { return String(lp.id) === String(tempId); });
        if (idx !== -1) { currentLocals[idx] = liveSavedData; lss('fitmate_local_posts', currentLocals); }
      }
    }
    
    if (!isCheckedIn) {
      isCheckedIn = true; 
      var savedStreak = ls('fitmate_streak', 0);
      var savedDate = ls('fitmate_streak_date', '');
      var yesterdayStr = new Date(Date.now() - 86400000).toDateString();
      
      if (savedDate === yesterdayStr) { 
        streak = savedStreak + 1; 
      } else { 
        streak = 1; // 中断了，重新开始计数
      }
      
      var badge = document.getElementById('mainStreakBadge'); if(badge) badge.textContent = '🔥 连续 ' + streak + ' 天';
      lss('fitmate_streak', streak);
      lss('fitmate_streak_date', todayStr);
    }
    
    show('🎉 打卡成功！动态已双流向对账同步');
    resetForm();
    await renderCircle(); 
  });

  function resetForm() {
    selectedSport = null; selectedBodyPart = null; selectedExercise = null;
    sportGrid.querySelectorAll('.sport-item').forEach(function(el) { el.classList.remove('selected'); });
    dynFormCard.style.display = 'none'; dynFormContent.innerHTML = '';
    extraCard.style.display = 'none'; btnConfirm.disabled = true;
    moodGrid.querySelectorAll('.mood-item').forEach(function(el) { el.classList.remove('selected'); });
    document.querySelector('.mood-item[data-mood="😄"]').classList.add('selected');
    selectedMood = '😄'; isPrivate = false; privToggle.classList.add('active'); 
  }

  moodGrid.querySelectorAll('.mood-item').forEach(function(el) {
    el.addEventListener('click', function() {
      moodGrid.querySelectorAll('.mood-item').forEach(function(m) { m.classList.remove('selected'); });
      this.classList.add('selected'); selectedMood = this.dataset.mood;
    });
  });
  document.querySelector('.mood-item[data-mood="😄"]').classList.add('selected');
  privToggle.addEventListener('click', function() { this.classList.toggle('active'); isPrivate = !this.classList.contains('active'); });

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // 7. AUTH
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  avGrid.querySelectorAll('.avatar-option').forEach(function(el) {
    el.addEventListener('click', function() {
      avGrid.querySelectorAll('.avatar-option').forEach(function(a) { a.classList.remove('selected'); });
      this.classList.add('selected'); selectedAvatar = this.dataset.avatar;
      btnStart.disabled = nickInput.value.trim().length === 0;
    });
  });
  nickInput.addEventListener('input', function() { btnStart.disabled = this.value.trim().length === 0; });

  btnStart.addEventListener('click', function() {
    nickname = nickInput.value.trim(); if (!nickname) return;
    var activeAv = avGrid.querySelector('.avatar-option.selected');
    if (activeAv) selectedAvatar = activeAv.dataset.avatar;
    
    topAvatar.textContent = selectedAvatar; topName.textContent = nickname;
    lss('fitmate_nickname', nickname); lss('fitmate_avatar', selectedAvatar);
    
    var savedStreakLogin = ls('fitmate_streak', 0), savedDateLogin = ls('fitmate_streak_date', ''), todayLogin = new Date().toDateString(), yesterdayLogin = new Date(Date.now() - 86400000).toDateString();
    var badge = document.getElementById('mainStreakBadge');
    if (savedDateLogin === todayLogin) {
      streak = savedStreakLogin; isCheckedIn = true; if(badge) badge.textContent = '🔥 连续 ' + streak + ' 天';
    } else if (savedDateLogin === yesterdayLogin) {
      streak = savedStreakLogin; isCheckedIn = false; if(badge) badge.textContent = '🔥 连续 ' + streak + ' 天（今日未打卡）';
    } else {
      streak = 0; isCheckedIn = false; if(badge) badge.textContent = '🔥 连续 0 天';
    }
    authScreen.classList.add('hidden'); mainScreen.classList.add('active');
    show('👋 欢迎回来，' + nickname + '！'); renderSports(); renderCircle(); pollNotifs(); startNotifPoll();
  });
  nickInput.addEventListener('keydown', function(e) { if (e.key === 'Enter' && !btnStart.disabled) btnStart.click(); });
  document.querySelector('.avatar-option').classList.add('selected');

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // 8. TAB NAVIGATION
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  navItems.forEach(function(item) {
    item.addEventListener('click', function() {
      var tab = this.dataset.tab;
      navItems.forEach(function(n) { n.classList.remove('active'); });
      this.classList.add('active');
      Object.keys(tabPages).forEach(function(k) { tabPages[k].classList.toggle('active', k === tab); });
      if (tab === 'circle') renderCircle();
      if (tab === 'rank') renderRankings();
      if (tab === 'mine') renderPersonalMineCenter();
    });
  });

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // 10. AUTO-LOGIN + INIT
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  (async function init() {
    await sbInit();
    initRankSelectors();
    applyLanguage('zh');

    var savedNick = ls('fitmate_nickname', '');
    var savedAv   = ls('fitmate_avatar', '');

    if (savedNick && savedAv) {
      nickname = savedNick; selectedAvatar = savedAv;
      topAvatar.textContent = selectedAvatar; topName.textContent = nickname;

      var savedStreak = ls('fitmate_streak', 0);
      var savedDate   = ls('fitmate_streak_date', '');
      var today       = new Date().toDateString();
      var yesterday   = new Date(Date.now() - 86400000).toDateString();
      var badge = document.getElementById('mainStreakBadge');

      if (savedDate === today) {
        streak = savedStreak; isCheckedIn = true; if(badge) badge.textContent = '🔥 连续 ' + streak + ' 天';
      } else if (savedDate === yesterday) {
        streak = savedStreak; isCheckedIn = false; if(badge) badge.textContent = '🔥 连续 ' + streak + ' 天（今日未打卡）';
      } else {
        streak = 0; isCheckedIn = false; if(badge) badge.textContent = '🔥 连续 0 天';
      }

      authScreen.classList.add('hidden'); mainScreen.classList.add('active');
      renderSports(); renderCircle(); pollNotifs(); startNotifPoll();
      show('👋 自动登录成功，' + nickname + '！');
    } else {
      var noAuthStreak = ls('fitmate_streak', 0); var noAuthDate = ls('fitmate_streak_date', ''); var noAuthToday = new Date().toDateString(); var noAuthYesterday = new Date(Date.now() - 86400000).toDateString();
      var badge = document.getElementById('mainStreakBadge');
      if (badge) {
        if (noAuthDate === noAuthToday) { badge.textContent = '🔥 连续 ' + noAuthStreak + ' 天'; } 
        else if (noAuthDate === noAuthYesterday) { badge.textContent = '🔥 连续 ' + noAuthStreak + ' 天（今日未打卡）'; }
        else { badge.textContent = '🔥 连续 0 天'; }
      }
    }

    console.log('🏋️ FitMate 云同步全功能生产版投产成功');
  })();
})();
</script>
</body>
