<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FitMate 健身打卡</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #111827;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ── 主容器，模拟手机屏幕 ── */
    #app {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      min-height: 100dvh;
      background: #1f2937;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
    }

    /* ── 登录/注册卡片 ── */
    #auth-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 32px 24px;
      animation: fadeIn 0.4s ease;
    }

    #auth-screen.hidden {
      display: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .auth-card {
      background: #374151;
      border-radius: 24px;
      padding: 32px 24px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    .logo-icon {
      width: 56px;
      height: 56px;
      background: #a3e635;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 28px;
    }

    .auth-title {
      font-size: 24px;
      font-weight: 700;
      color: #f9fafb;
      text-align: center;
    }

    .auth-sub {
      color: #9ca3af;
      text-align: center;
      font-size: 14px;
      margin-top: 4px;
      margin-bottom: 28px;
    }

    .input-label {
      color: #d1d5db;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
    }

    .nickname-input {
      width: 100%;
      padding: 14px 16px;
      background: #4b5563;
      border: 2px solid #6b7280;
      border-radius: 14px;
      color: #f9fafb;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .nickname-input:focus {
      border-color: #a3e635;
    }

    .nickname-input::placeholder {
      color: #6b7280;
    }

    .avatar-label {
      color: #d1d5db;
      font-size: 13px;
      font-weight: 600;
      margin-top: 24px;
      margin-bottom: 12px;
      display: block;
    }

    .avatar-grid {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    .avatar-option {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #4b5563;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      cursor: pointer;
      border: 3px solid transparent;
      transition: all 0.2s;
    }

    .avatar-option:hover {
      border-color: #9ca3af;
    }

    .avatar-option.selected {
      border-color: #a3e635;
      background: #3f6212;
      box-shadow: 0 0 16px rgba(163, 230, 53, 0.35);
    }

    .btn-start {
      width: 100%;
      margin-top: 32px;
      padding: 16px;
      background: #a3e635;
      color: #111827;
      font-size: 17px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    .btn-start:hover {
      background: #84cc16;
    }

    .btn-start:active {
      transform: scale(0.97);
    }

    .btn-start:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    /* ── 主页面 ── */
    #main-screen {
      flex: 1;
      display: none;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
    }

    #main-screen.active {
      display: flex;
    }

    /* 顶部栏 */
    .top-bar {
      padding: 16px 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1f2937;
      border-bottom: 1px solid #374151;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .top-bar-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #4b5563;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .top-bar-name {
      color: #f9fafb;
      font-weight: 600;
      font-size: 15px;
    }

    .top-bar-badge {
      background: #a3e635;
      color: #111827;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 10px;
    }

    /* ── 内容区域 ── */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .tab-page {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .tab-page.active {
      display: block;
    }

    /* ── 打卡页 卡片 ── */
    .checkin-card {
      background: #374151;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 16px;
    }

    .checkin-card h3 {
      color: #f9fafb;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .streak-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .streak-num {
      font-size: 36px;
      font-weight: 800;
      color: #a3e635;
    }

    .streak-label {
      color: #9ca3af;
      font-size: 13px;
    }

    .btn-checkin {
      width: 100%;
      padding: 16px;
      background: #a3e635;
      color: #111827;
      font-size: 17px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    .btn-checkin:active {
      transform: scale(0.97);
    }

    .btn-checkin.done {
      background: #4b5563;
      color: #6b7280;
      cursor: default;
    }

    .btn-checkin.done:active {
      transform: none;
    }

    .checkin-time {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      margin-top: 8px;
    }

    /* ── 圈子 / 排行榜 / 我的 占位 ── */
    .placeholder-card {
      background: #374151;
      border-radius: 20px;
      padding: 40px 24px;
      text-align: center;
    }

    .placeholder-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .placeholder-title {
      color: #f9fafb;
      font-size: 18px;
      font-weight: 600;
    }

    .placeholder-desc {
      color: #6b7280;
      font-size: 14px;
      margin-top: 6px;
    }

    /* ── 底部导航栏 ── */
    .bottom-nav {
      background: #111827;
      border-top: 1px solid #374151;
      display: flex;
      padding: 6px 0 env(safe-area-inset-bottom, 6px) 0;
      flex-shrink: 0;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 0;
      cursor: pointer;
      color: #6b7280;
      transition: color 0.2s;
      user-select: none;
    }

    .nav-item .nav-icon {
      font-size: 22px;
      line-height: 1;
    }

    .nav-item .nav-label {
      font-size: 10px;
      margin-top: 2px;
      font-weight: 500;
    }

    .nav-item.active {
      color: #a3e635;
    }

    /* ── 提示toast ── */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: #374151;
      color: #f9fafb;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      max-width: 360px;
      width: calc(100% - 40px);
      text-align: center;
      z-index: 999;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* 滚动条 */
    .content-area::-webkit-scrollbar {
      width: 4px;
    }
    .content-area::-webkit-scrollbar-track {
      background: transparent;
    }
    .content-area::-webkit-scrollbar-thumb {
      background: #4b5563;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div id="app">

  <!-- ==================== Toast ==================== -->
  <div id="toast" class="toast"></div>

  <!-- ==================== 登录/注册 ==================== -->
  <div id="auth-screen">
    <div class="auth-card">
      <div class="logo-icon">💪</div>
      <div class="auth-title">FitMate</div>
      <div class="auth-sub">健身打卡 · 遇见更好的自己</div>

      <label class="input-label" for="nickname">你的昵称</label>
      <input
        id="nickname"
        class="nickname-input"
        type="text"
        placeholder="输入昵称..."
        maxlength="12"
        autocomplete="off"
      />

      <span class="avatar-label">选择头像</span>
      <div class="avatar-grid" id="avatarGrid">
        <div class="avatar-option" data-avatar="🏃">🏃</div>
        <div class="avatar-option" data-avatar="🏋️">🏋️</div>
        <div class="avatar-option" data-avatar="🧘">🧘</div>
      </div>

      <button class="btn-start" id="btnStart" disabled>开启健身之旅</button>
    </div>
  </div>

  <!-- ==================== 主页面 ==================== -->
  <div id="main-screen">

    <!-- 顶部栏 -->
    <div class="top-bar">
      <div class="top-bar-left">
        <div class="top-bar-avatar" id="topAvatar">🏃</div>
        <span class="top-bar-name" id="topName">用户</span>
      </div>
      <span class="top-bar-badge">🔥 连续 0 天</span>
    </div>

    <!-- 内容区域 -->
    <div class="content-area" id="contentArea">

      <!-- 打卡页 -->
      <div class="tab-page active" id="page-checkin">
        <div class="checkin-card">
          <h3>📅 今日打卡</h3>
          <div class="streak-row">
            <span class="streak-num" id="streakNum">0</span>
            <div>
              <div style="color:#f9fafb;font-weight:600;">连续打卡天数</div>
              <div class="streak-label">坚持就是胜利 💪</div>
            </div>
          </div>
          <button class="btn-checkin" id="btnCheckin">✅ 立即打卡</button>
          <div class="checkin-time" id="checkinTime"></div>
        </div>
        <div class="checkin-card">
          <h3>🏆 今日目标</h3>
          <p style="color:#9ca3af;font-size:14px;">
            运动 30 分钟 · 喝水 8 杯 · 早睡 🌙
          </p>
        </div>
      </div>

      <!-- 圈子页 -->
      <div class="tab-page" id="page-circle">
        <div class="placeholder-card">
          <div class="placeholder-icon">🌐</div>
          <div class="placeholder-title">运动圈子</div>
          <div class="placeholder-desc">在这里找到志同道合的健身伙伴，一起打卡进步！</div>
        </div>
      </div>

      <!-- 排行榜页 -->
      <div class="tab-page" id="page-rank">
        <div class="placeholder-card">
          <div class="placeholder-icon">🏅</div>
          <div class="placeholder-title">排行榜</div>
          <div class="placeholder-desc">查看本周运动排行，和好友一较高下！</div>
        </div>
      </div>

      <!-- 我的页 -->
      <div class="tab-page" id="page-mine">
        <div class="placeholder-card">
          <div class="placeholder-icon">👤</div>
          <div class="placeholder-title">个人中心</div>
          <div class="placeholder-desc">查看你的运动统计与成就徽章</div>
        </div>
      </div>

    </div>

    <!-- 底部导航栏 -->
    <div class="bottom-nav">
      <div class="nav-item active" data-tab="checkin">
        <span class="nav-icon">✅</span>
        <span class="nav-label">打卡</span>
      </div>
      <div class="nav-item" data-tab="circle">
        <span class="nav-icon">🌐</span>
        <span class="nav-label">圈子</span>
      </div>
      <div class="nav-item" data-tab="rank">
        <span class="nav-icon">🏅</span>
        <span class="nav-label">排行榜</span>
      </div>
      <div class="nav-item" data-tab="mine">
        <span class="nav-icon">👤</span>
        <span class="nav-label">我的</span>
      </div>
    </div>

  </div>

</div>

<script>
  (function () {
    'use strict';

    // ── DOM 引用 ──
    const authScreen    = document.getElementById('auth-screen');
    const mainScreen    = document.getElementById('main-screen');
    const nicknameInput = document.getElementById('nickname');
    const avatarGrid    = document.getElementById('avatarGrid');
    const btnStart      = document.getElementById('btnStart');
    const topAvatar     = document.getElementById('topAvatar');
    const topName       = document.getElementById('topName');
    const streakNum     = document.getElementById('streakNum');
    const btnCheckin    = document.getElementById('btnCheckin');
    const checkinTime   = document.getElementById('checkinTime');
    const toast         = document.getElementById('toast');

    const navItems = document.querySelectorAll('.nav-item');
    const tabPages = {
      checkin: document.getElementById('page-checkin'),
      circle:  document.getElementById('page-circle'),
      rank:    document.getElementById('page-rank'),
      mine:    document.getElementById('page-mine'),
    };

    // ── 状态 ──
    let selectedAvatar = '🏃';
    let nickname       = '';
    let isCheckedIn    = false;
    let streak         = 0;
    let streakBadge    = document.querySelector('.top-bar-badge');

    // ── Toast ──
    let toastTimer = null;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // ── 头像选择 ──
    avatarGrid.querySelectorAll('.avatar-option').forEach(el => {
      el.addEventListener('click', function () {
        avatarGrid.querySelectorAll('.avatar-option').forEach(a => a.classList.remove('selected'));
        this.classList.add('selected');
        selectedAvatar = this.dataset.avatar;
        validateForm();
      });
    });

    // ── 昵称输入 ──
    nicknameInput.addEventListener('input', validateForm);

    function validateForm() {
      const val = nicknameInput.value.trim();
      btnStart.disabled = val.length === 0;
    }

    // ── 登录 ──
    btnStart.addEventListener('click', function () {
      nickname = nicknameInput.value.trim();
      if (!nickname) return;

      topAvatar.textContent = selectedAvatar;
      topName.textContent   = nickname;
      streakBadge.textContent = '🔥 连续 0 天';

      authScreen.classList.add('hidden');
      mainScreen.classList.add('active');

      showToast(`👋 欢迎回来，${nickname}！`);
    });

    // ── 底部导航切换 ──
    navItems.forEach(item => {
      item.addEventListener('click', function () {
        const tab = this.dataset.tab;

        navItems.forEach(n => n.classList.remove('active'));
        this.classList.add('active');

        Object.keys(tabPages).forEach(key => {
          tabPages[key].classList.toggle('active', key === tab);
        });
      });
    });

    // ── 打卡 ──
    btnCheckin.addEventListener('click', function () {
      if (isCheckedIn) {
        showToast('⏰ 今天已经打过卡啦，明天继续！');
        return;
      }

      isCheckedIn = true;
      streak += 1;
      streakNum.textContent = streak;
      streakBadge.textContent = `🔥 连续 ${streak} 天`;

      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const timeStr = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
      checkinTime.textContent = `⏱ 今日打卡时间 ${timeStr}`;

      btnCheckin.textContent = '✅ 已打卡';
      btnCheckin.classList.add('done');

      showToast(`🎉 打卡成功！已连续 ${streak} 天`);
    });

    // ── 默认选中第一个头像 ──
    document.querySelector('.avatar-option').classList.add('selected');

    // ── 键盘 Enter 触发登录 ──
    nicknameInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !btnStart.disabled) {
        btnStart.click();
      }
    });

  })();
</script>
</body>
</html>
