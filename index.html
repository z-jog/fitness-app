<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FitMate 健身打卡</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #111827; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    #app { width: 100%; max-width: 420px; height: 100vh; height: 100dvh; position: relative; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(0,0,0,0.6); }
    #auth-screen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 32px 24px; }
    #auth-screen.hidden { display: none; }
    .auth-card { background: #374151; border-radius: 24px; padding: 32px 24px; width: 100%; box-shadow: 0 8px 32px rgba(0,0,0,0.35); }
    .logo-icon { width: 56px; height: 56px; background: #a3e635; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 28px; }
    .auth-title { font-size: 24px; font-weight: 700; color: #f9fafb; text-align: center; }
    .auth-sub { color: #9ca3af; text-align: center; font-size: 14px; margin-top: 4px; margin-bottom: 28px; }
    .input-label { color: #d1d5db; font-size: 13px; font-weight: 600; margin-bottom: 6px; display: block; }
    .nickname-input { width: 100%; padding: 14px 16px; background: #4b5563; border: 2px solid #6b7280; border-radius: 14px; color: #f9fafb; font-size: 16px; outline: none; }
    .avatar-label { color: #d1d5db; font-size: 13px; font-weight: 600; margin-top: 24px; margin-bottom: 12px; display: block; }
    .avatar-grid { display: flex; gap: 16px; justify-content: center; }
    .avatar-option { width: 64px; height: 64px; border-radius: 50%; background: #4b5563; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; border: 3px solid transparent; }
    .avatar-option.selected { border-color: #a3e635; background: #3f6212; }
    .btn-start { width: 100%; margin-top: 32px; padding: 16px; background: #a3e635; color: #111827; font-size: 17px; font-weight: 700; border-radius: 14px; }
    .btn-start:disabled { opacity: 0.4; }
    #main-screen { flex: 1; display: none; flex-direction: column; height: 100%; overflow: hidden; }
    #main-screen.active { display: flex; }
    .top-bar { padding: 16px 20px 12px; display: flex; align-items: center; justify-content: space-between; background: #1f2937; border-bottom: 1px solid #374151; flex-shrink: 0; }
    .top-bar-avatar { width: 36px; height: 36px; border-radius: 50%; background: #4b5563; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .top-bar-name { color: #f9fafb; font-weight: 600; font-size: 15px; }
    .top-bar-badge { background: #a3e635; color: #111827; font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 10px; }
    .content-area { flex: 1; overflow-y: auto; padding: 20px; }
    .tab-page { display: none; }
    .tab-page.active { display: block; }
    .checkin-card { background: #374151; border-radius: 20px; padding: 24px; margin-bottom: 16px; }
    .sport-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
    .sport-item { background: #4b5563; border-radius: 14px; padding: 12px 4px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; user-select: none; }
    .sport-item.selected { border-color: #a3e635; background: #3f6212; }
    .sport-emoji { font-size: 24px; display: block; }
    .sport-name { font-size: 11px; color: #d1d5db; margin-top: 4px; display: block; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; color: #d1d5db; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .form-input { width: 100%; padding: 12px 14px; background: #4b5563; border: 2px solid #6b7280; border-radius: 12px; color: #f9fafb; font-size: 15px; outline: none; }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }
    .body-part-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .body-part-tab { padding: 8px 16px; background: #4b5563; border-radius: 20px; color: #d1d5db; font-size: 13px; font-weight: 600; cursor: pointer; border: 2px solid transparent; }
    .body-part-tab.active { border-color: #a3e635; background: #3f6212; color: #f9fafb; }
    .mood-grid { display: flex; gap: 12px; justify-content: center; margin-bottom: 16px; }
    .mood-item { width: 48px; height: 48px; border-radius: 50%; background: #4b5563; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; border: 2px solid transparent; }
    .mood-item.selected { border-color: #a3e635; background: #3f6212; }
    .privacy-toggle { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 16px; }
    .privacy-toggle span { color: #9ca3af; font-size: 13px; }
    .toggle-switch { width: 48px; height: 26px; background: #4b5563; border-radius: 13px; cursor: pointer; position: relative; transition: background 0.25s; }
    .toggle-switch.active { background: #a3e635; }
    .toggle-switch::after { content: ''; position: absolute; width: 22px; height: 22px; background: #f9fafb; border-radius: 50%; top: 2px; left: 2px; transition: transform 0.25s; }
    .toggle-switch.active::after { transform: translateX(22px); }
    .btn-confirm-checkin { width: 100%; padding: 16px; background: #a3e635; color: #111827; font-size: 17px; font-weight: 700; border: none; border-radius: 14px; cursor: pointer; margin-top: 8px; }
    .btn-confirm-checkin:disabled { opacity: 0.4; }
    .post-card { background: #374151; border-radius: 18px; padding: 18px; margin-bottom: 14px; }
    .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .post-avatar { width: 38px; height: 38px; border-radius: 50%; background: #4b5563; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .post-author { color: #f9fafb; font-weight: 600; font-size: 14px; }
    .post-time { color: #6b7280; font-size: 11px; }
    .post-sport { font-size: 13px; margin: 4px 0 8px; }
    .post-sport .sport-tag { color: #a3e635; font-weight: 600; }
    .post-data { color: #9ca3af; font-size: 13px; line-height: 1.6; margin-bottom: 8px; }
    .post-mood { font-size: 16px; margin-top: 4px; }
    .post-actions { display: flex; gap: 24px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #4b5563; }
    .action-btn { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #9ca3af; font-size: 13px; }
    .action-btn.liked { color: #ef4444; }
    .post-comments { margin-top: 10px; border-top: 1px solid #4b5563; padding-top: 8px; }
    .comment-item { color: #d1d5db; font-size: 13px; padding: 4px 0; cursor: pointer; }
    .comment-author { color: #a3e635; font-weight: 600; }
    .comment-reply-to { color: #6b7280; }
    .reply-text { color: #a3e635; font-weight: 600; }
    .comment-show-btn { color: #6b7280; font-size: 13px; cursor: pointer; }
    .comment-input-wrap { display: flex; gap: 8px; margin-top: 8px; }
    .comment-input { flex: 1; padding: 10px 14px; background: #4b5563; border: 2px solid #6b7280; border-radius: 20px; color: #f9fafb; font-size: 13px; outline: none; }
    .comment-send { width: 36px; height: 36px; border-radius: 50%; background: #a3e635; color: #111827; border: none; font-size: 16px; cursor: pointer; }
    .bottom-nav { background: #111827; border-top: 1px solid #374151; display: flex; padding: 6px 0 env(safe-area-inset-bottom, 6px) 0; flex-shrink: 0; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 0; cursor: pointer; color: #6b7280; position: relative; }
    .nav-item .nav-icon { font-size: 22px; line-height: 1; }
    .nav-item .nav-label { font-size: 10px; margin-top: 2px; }
    .nav-item.active { color: #a3e635; }
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-80px); background: #374151; color: #f9fafb; padding: 12px 24px; border-radius: 12px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 999; transition: transform 0.35s; pointer-events: none; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .light-theme-active { background: #f3f4f6 !important; }
    .light-theme-active #app { background: #f9fafb !important; }
    .light-theme-active .checkin-card, .light-theme-active .post-card, .light-theme-active .auth-card { background: #ffffff !important; border: 1px solid #e5e7eb !important; }
    .light-theme-active h2, .light-theme-active h3, .light-theme-active .top-bar-name, .light-theme-active .auth-title { color: #111827 !important; }
    .light-theme-active span, .light-theme-active label, .light-theme-active .post-data, .light-theme-active .streak-label { color: #4b5563 !important; }
    .light-theme-active .sport-item, .light-theme-active .body-part-tab, .light-theme-active .comment-input, .light-theme-active .nickname-input, .light-theme-active .avatar-option, .light-theme-active select { background: #f3f4f6 !important; color: #111827 !important; border-color: #d1d5db !important; }
    .light-theme-active .sport-item.selected, .light-theme-active .body-part-tab.active, .light-theme-active .avatar-option.selected { background: #ecfccb !important; border-color: #84cc16 !important; }
    .light-theme-active .bottom-nav, .light-theme-active .top-bar { background: #ffffff !important; border-color: #e5e7eb !important; }
    .light-theme-active .rank-btn { background: #374151; color: #f9fafb; }
    .light-theme-active .rank-btn.active { background: #a3e635; color: #111827; }
    .light-theme-active .cal-day { color: #4b5563; }
    .light-theme-active .cal-day.has-data { background: #ecfccb !important; color: #3f6212 !important; font-weight: 700; }
  </style>
</head>
<body>

<div id="app">
  <div id="toast" class="toast"></div>

  <!-- 登录界面 -->
  <div id="auth-screen">
    <div class="auth-card">
      <div class="logo-icon">💪</div>
      <div id="lblAuthTitle" class="auth-title">FitMate</div>
      <div id="lblAuthSub" class="auth-sub">健身打卡 · 遇见更好的自己</div>
      <label id="lblNickLabel" class="input-label" for="nickname">你的昵称</label>
      <input id="nickname" class="nickname-input" type="text" placeholder="输入昵称..." maxlength="12" autocomplete="off" />
      <span id="lblAvatarLabel" class="avatar-label">选择头像</span>
      <div class="avatar-grid" id="avatarGrid">
        <div class="avatar-option" data-avatar="🏃">🏃</div>
        <div class="avatar-option" data-avatar="🏋️">🏋️</div>
        <div class="avatar-option" data-avatar="🧘">🧘</div>
      </div>
      <button class="btn-start" id="btnStart" disabled>开启健身之旅</button>
    </div>
  </div>

  <!-- 主应用壳子 -->
  <div id="main-screen">
    <div class="top-bar">
      <div class="top-bar-left">
        <div class="top-bar-avatar" id="topAvatar">🏃</div>
        <span class="top-bar-name" id="topName">用户</span>
      </div>
      <span class="top-bar-badge" id="mainStreakBadge">🔥 连续 0 天</span>
    </div>

    <div class="content-area" id="contentArea">
      <!-- 打卡标签页 -->
      <div class="tab-page active" id="page-checkin">
        <div style="display:none;"><span id="streakNum">0</span><button id="btnCheckin"></button><div id="checkinTime"></div></div>
        <div class="checkin-card">
          <h3 id="lblSelectSport">🏋️ 选择运动</h3>
          <div class="sport-grid" id="sportGrid"></div>
        </div>
        <div class="checkin-card" id="dynamicFormCard" style="display:none;">
          <h3 id="formTitle">📋 运动详情</h3>
          <div id="dynamicFormContent"></div>
        </div>
        <div class="checkin-card" id="extraCard" style="display:none;">
          <h3 id="lblTodayMood">😊 今日状态</h3>
          <div class="mood-grid" id="moodGrid">
            <div class="mood-item selected" data-mood="😄">😄</div>
            <div class="mood-item" data-mood="😮‍💨">😮‍💨</div>
            <div class="mood-item" data-mood="💪">💪</div>
          </div>
          <div class="privacy-toggle">
            <span id="lblPrivSelf">🔒 仅自己可见</span>
