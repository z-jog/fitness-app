<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #111827; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    #app { width: 100%; max-width: 420px; height: 100vh; height: 100dvh; position: relative; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(0,0,0,0.6); background: #1f2937; }
    #auth-screen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 32px 24px; }
    #auth-screen.hidden { display: none !important; }
    .auth-card { background: #374151; border-radius: 24px; padding: 32px 24px; width: 100%; box-shadow: 0 8px 32px rgba(0,0,0,0.35); }
    .logo-icon { width: 56px; height: 56px; background: #a3e635; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 28px; }
    .auth-title { font-size: 24px; font-weight: 700; color: #f9fafb; text-align: center; }
    .auth-sub { color: #9ca3af; text-align: center; font-size: 14px; margin-top: 4px; margin-bottom: 28px; }
    .nickname-input { width: 100%; padding: 14px 16px; background: #4b5563; border: 2px solid #6b7280; border-radius: 14px; color: #f9fafb; font-size: 16px; outline: none; }
    .avatar-grid { display: flex; gap: 16px; justify-content: center; margin: 20px 0; }
    .avatar-option { width: 64px; height: 64px; border-radius: 50%; background: #4b5563; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; border: 3px solid transparent; }
    .avatar-option.selected { border-color: #a3e635; background: #3f6212; }
    .btn-start { width: 100%; margin-top: 32px; padding: 16px; background: #a3e635; color: #111827; font-size: 17px; font-weight: 700; border-radius: 14px; cursor: pointer; }
    .btn-start:disabled { opacity: 0.4; }
    #main-screen { flex: 1; display: none; flex-direction: column; height: 100%; overflow: hidden; }
    #main-screen.active { display: flex !important; }
    .top-bar { padding: 16px 20px 12px; display: flex; align-items: center; justify-content: space-between; background: #1f2937; border-bottom: 1px solid #374151; flex-shrink: 0; }
    .top-bar-avatar { width: 36px; height: 36px; border-radius: 50%; background: #4b5563; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .top-bar-name { color: #f9fafb; font-weight: 600; font-size: 15px; }
    .top-bar-badge { background: #a3e635; color: #111827; font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 10px; }
    .content-area { flex: 1; overflow-y: auto; padding: 20px; }
    .tab-page { display: none; }
    .tab-page.active { display: block; }
    .checkin-card { background: #374151; border-radius: 20px; padding: 24px; margin-bottom: 16px; }
    .sport-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
    .sport-item { background: #4b5563; border-radius: 14px; padding: 12px 4px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; user-select: none; }
    .sport-item.selected { border-color: #a3e635; background: #3f6212; }
    .form-input { width: 100%; padding: 12px 14px; background: #4b5563; border: 2px solid #6b7280; border-radius: 12px; color: #f9fafb; outline: none; }
    .body-part-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .body-part-tab { padding: 8px 16px; background: #4b5563; border-radius: 20px; color: #d1d5db; font-size: 13px; font-weight: 600; cursor: pointer; border: 2px solid transparent; }
    .body-part-tab.active { border-color: #a3e635; background: #3f6212; color: #f9fafb; }
    .mood-grid { display: flex; gap: 12px; justify-content: center; margin-bottom: 16px; }
    .mood-item { width: 48px; height: 48px; border-radius: 50%; background: #4b5563; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; border: 2px solid transparent; }
    .mood-item.selected { border-color: #a3e635; background: #3f6212; }
    .privacy-toggle { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 16px; cursor: pointer; }
    .toggle-switch { width: 48px; height: 26px; background: #4b5563; border-radius: 13px; position: relative; transition: background 0.25s; }
    .toggle-switch.active { background: #a3e635; }
    .toggle-switch::after { content: ''; position: absolute; width: 22px; height: 22px; background: #f9fafb; border-radius: 50%; top: 2px; left: 2px; transition: transform 0.25s; }
    .toggle-switch.active::after { transform: translateX(22px); }
    .btn-confirm-checkin { width: 100%; padding: 16px; background: #a3e635; color: #111827; font-size: 17px; font-weight: 700; border-radius: 14px; cursor: pointer; }
    .btn-confirm-checkin:disabled { opacity: 0.4; }
    .post-card { background: #374151; border-radius: 18px; padding: 18px; margin-bottom: 14px; }
    .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .post-avatar { width: 38px; height: 38px; border-radius: 50%; background: #4b5563; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .bottom-nav { background: #111827; border-top: 1px solid #374151; display: flex; padding: 6px 0 env(safe-area-inset-bottom, 6px) 0; flex-shrink: 0; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: #6b7280; }
    .nav-item.active { color: #a3e635; }
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-80px); background: #374151; color: #f9fafb; padding: 12px 24px; border-radius: 12px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 999; transition: transform 0.35s; pointer-events: none; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .light-theme-active { background: #f3f4f6 !important; }
    .light-theme-active #app { background: #f9fafb !important; }
    .light-theme-active .checkin-card, .light-theme-active .post-card, .light-theme-active .auth-card { background: #ffffff !important; border: 1px solid #e5e7eb !important; }
    .light-theme-active h2, .light-theme-active h3, .light-theme-active .top-bar-name, .light-theme-active .auth-title { color: #111827 !important; }
    .light-theme-active span, .light-theme-active label { color: #4b5563 !important; }
  </style>
</head>
<body>

<div id="app">
  <div id="toast" class="toast"></div>

  <div id="auth-screen">
    <div class="auth-card">
      <div class="logo-icon">💪</div>
      <div class="auth-title" id="lblAuthTitle">FitMate</div>
      <div class="auth-sub" id="lblAuthSub">健身打卡 · 遇见更好的自己</div>
      <input id="nickname" class="nickname-input" type="text" placeholder="你的昵称..." maxlength="12" />
      <div class="avatar-grid" id="avatarGrid">
        <div class="avatar-option selected" data-avatar="🏃">🏃</div>
        <div class="avatar-option" data-avatar="🏋️">🏋️</div>
        <div class="avatar-option" data-avatar="🧘">🧘</div>
      </div>
      <button class="btn-start" id="btnStart" disabled>开启健身之旅</button>
    </div>
  </div>

  <div id="main-screen">
    <div class="top-bar">
      <div class="flex items-center gap-2">
        <div class="top-bar-avatar" id="topAvatar">🏃</div>

      <span class="top-bar-badge" id="mainStreakBadge">🔥 连续 0 天</span>

      <div class="tab-page active" id="page-checkin">
        <div class="checkin-card">

          <div class="sport-grid" id="sportGrid"></div>
        </div>
        <div class="checkin-card" id="dynamicFormCard" style="display:none;">
          <h3 id="formTitle" class="text-white mb-4">📋 运动详情</h3>
          <div id="dynamicFormContent"></div>
        </div>
        <div class="checkin-card" id="extraCard" style="display:none;">
          <div class="mb-4">
            <label class="text-xs text-gray-400 font-bold block mb-1" id="lblCheckinDate">📅 运动日期(可做补打卡)</label>
            <input type="date" id="checkinDate" class="w-full p-2.5 bg-gray-600 rounded-xl text-white text-xs outline-none border border-gray-500 font-mono" />
          </div>
          <h3 class="text-white mb-4" id="lblTodayMood">😊 今日状态</h3>
          <div class="mood-grid" id="moodGrid">
            <div class="mood-item selected" data-mood="😄">😄</div>
            <div class="mood-item" data-mood="😮‍💨">😮‍💨</div>
            <div class="mood-item" data-mood="💪">💪</div>
          </div>
          <div class="privacy-toggle" id="privacyToggleContainer">
            <span class="text-gray-400 text-xs" id="lblPrivSelf">🔒 仅自己可见</span>
            <div class="toggle-switch active" id="privacyToggle"></div>
            <span class="text-gray-400 text-xs" id="lblPrivAll">🌍 所有人可见</span>
          </div>
          <button class="btn-confirm-checkin" id="btnConfirmCheckin" disabled>💾 确认打卡</button>
        </div>
      </div>

      <div class="tab-page" id="page-circle">
        <h2 class="text-white mb-4 px-1" id="lblTabCircle">🌐 运动圈子</h2>
        <div id="circleFeed"></div>
      </div>

      <div class="tab-page" id="page-rank">
        <div class="flex gap-1.5 mb-4" id="rankTabs">
          <button class="flex-1 py-2 text-[11px] font-bold rounded-lg bg-lime-400 text-gray-900 active" data-rep="3.1" id="lblRep1">当月时长榜</button>
          <button class="flex-1 py-2 text-[11px] font-bold rounded-lg bg-gray-700 text-white" data-rep="3.2" id="lblRep2">当月次数榜</button>
          <button class="flex-1 py-2 text-[11px] font-bold rounded-lg bg-gray-700 text-white" data-rep="3.3" id="lblRep3">当月跑步榜</button>
        </div>
        <div id="rankList" class="flex flex-col gap-2"></div>
      </div>

      <div class="tab-page" id="page-mine">
        <div class="checkin-card text-center">
          <div class="w-16 h-16 bg-lime-400 rounded-full flex items-center justify-center text-3xl mx-auto mb-3" id="mineAvatar">🏃</div>
          <h2 class="text-xl font-bold text-white mb-4" id="mineName">用户</h2>
          <div class="grid grid-cols-2 gap-4 border-t border-gray-600/50 pt-4">
            <div><div class="text-2xl font-black text-lime-400" id="statDuration">0</div><div class="text-xs text-gray-400" id="lblStatHours">终身总时长(分)</div></div>
            <div><div class="text-2xl font-black text-lime-400" id="statCounts">0</div><div class="text-xs text-gray-400" id="lblStatTimes">终身总打卡(次)</div></div>
          </div>
        </div>
        <div class="checkin-card">
          <h3 class="text-sm font-bold text-white mb-3" id="lblFootprintCal">👣 运动足迹日历</h3>
          <div class="grid grid-cols-7 gap-1" id="calendarGrid"></div>
        </div>
        <div class="checkin-card">
          <h3 class="text-sm font-bold text-white border-b border-gray-600/50 pb-2 mb-4" id="lblSysSettings">⚙️ 账号与系统设置</h3>
          <div class="flex flex-col gap-4">
            <div class="flex items-center gap-2">
              <input id="newNickname" class="flex-1 p-2 bg-gray-600 rounded-lg text-white text-xs outline-none" type="text" placeholder="输入新昵称..." maxlength="12" />
              <button id="btnUpdateName" class="px-4 py-2 bg-lime-400 text-gray-900 text-xs font-bold rounded-lg">修改昵称</button>
            </div>
            <div class="flex justify-between items-center text-xs">
              <span class="text-gray-300" id="lblSetTheme">视觉主题模式</span>
              <button id="btnToggleTheme" class="px-3 py-1 bg-gray-600 text-white rounded">Dark/Light</button>
            </div>
            <div class="flex justify-between items-center text-xs">
              <span class="text-gray-300" id="lblSetLang">多语言环境</span>
              <button id="btnToggleLang" class="px-3 py-1 bg-gray-600 text-white rounded font-bold">English</button>
            </div>
            <button onclick="localStorage.clear(); location.reload();" class="w-full py-2 bg-red-500/20 text-red-500 text-xs font-bold rounded-lg border border-red-500/30">退出并重置所有数据</button>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom-nav">
      <div class="nav-item active" data-tab="checkin"><span>✅</span><span class="text-[10px] nav-lbl">打卡</span></div>
      <div class="nav-item" data-tab="circle"><span>🌐</span><span class="text-[10px] nav-lbl">圈子</span></div>
      <div class="nav-item" data-tab="rank"><span>🏅</span><span class="text-[10px] nav-lbl">排行</span></div>
      <div class="nav-item" data-tab="mine"><span>👤</span><span class="text-[10px] nav-lbl">我的</span></div>
    </div>
  </div>
</div>

<script>
(function () { 'use strict';
  const SUPABASE_URL = 'https://kuvrzqdpccahujhcvrpp.supabase.co';
  const SUPABASE_ANON = 'sb_publishable_Gn_6laUiGUYHANt916z8sw_og6ZIMTr';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  var ALL_SPORTS = [
    { id: 'boxing', name: '拳击', emoji: '🥊', type: 'normal' },
    { id: 'running', name: '跑步', emoji: '🏃‍♂️', type: 'distance' }, { id: 'cycling', name: '骑行', emoji: '🚴‍♂️', type: 'distance' }, { id: 'swimming', name: '游泳', emoji: '🏊‍♂️', type: 'distance' }, { id: 'anaerobic', name: '无氧', emoji: '🏋️‍♂️', type: 'anaerobic' },
    { id: 'basketball', name: '篮球', emoji: '🏀', type: 'normal' }, { id: 'football', name: '足球', emoji: '⚽', type: 'normal' }, { id: 'badminton', name: '羽毛球', emoji: '🏸', type: 'normal' }, { id: 'tabletennis', name: '乒乓球', emoji: '🏓', type: 'normal' },
    { id: 'tennis', name: '网球', emoji: '🎾', type: 'normal' }, { id: 'jumpRope', name: '跳绳', emoji: '🪢', type: 'normal' }, { id: 'dance', name: '舞蹈', emoji: '💃', type: 'normal' }, { id: 'climbing', name: '攀岩', emoji: '🧗‍♂️', type: 'normal' },
    { id: 'hiking', name: '徒步', emoji: '🥾', type: 'normal' }, { id: 'elliptical', name: '椭圆机', emoji: '🌀', type: 'normal' }, { id: 'yoga', name: '瑜伽', emoji: '🧘‍♀️', type: 'normal' }, { id: 'pilates', name: '普拉提', emoji: '🩰', type: 'normal' },
    { id: 'skiing', name: '滑雪', emoji: '⛷️', type: 'normal' }, { id: 'mixedCardio', name: '混合有氧', emoji: '𫤗', type: 'normal' }, { id: 'stairs', name: '爬楼梯', emoji: '🪜', type: 'normal' }
  ];
  const BODY_PARTS = [{ id: 'chest', label: '练胸' }, { id: 'back', label: '练背' }, { id: 'shoulder', label: '练肩' }, { id: 'leg', label: '练腿' }, { id: 'glute', label: '练臀' }, { id: 'arm', label: '练手臂' }, { id: 'abs', label: '练腹' }];

  let nickname = '', selectedAvatar = '🏃', selectedSport = null, selectedBodyPart = null, selectedMood = '😄', isPrivate = false, currentTheme = 'dark', activeReport = '3.1', currentLang = 'zh';

  var I18N_DICT = {
    zh: { logo_title: "FitMate", logo_sub: "健身打卡 · 遇见更好的自己", select_sport: "🏋️ 选择运动", today_mood: "😊 今日状态", priv_self: "🔒 仅自己可见", priv_all: "🌍 所有人可见", rep_1: "当月时长", rep_2: "当月次数", rep_3: "当月跑步", stat_hours: "终身总时长(分)", stat_times: "终身总打卡(次)", footprint_cal: "👣 运动足迹日历", sys_settings: "⚙️ 账号与系统设置", set_theme: "视觉主题模式", set_lang: "多语言环境", nav_punch: "打卡", nav_circle_l: "圈子", nav_rank: "排行", nav_mine: "我的", date_lbl: "📅 运动日期(可做补打卡)", streak_txt: "连续" },
    en: { logo_title: "FitMate", logo_sub: "Fitness · Meet Better Self", select_sport: "🏋️ Choose Sport", today_mood: "😊 Energy Status", priv_self: "🔒 Private", priv_all: "🌍 Public", rep_1: "M-Duration", rep_2: "M-Workouts", rep_3: "M-Running", stat_hours: "Life Mins", stat_times: "Life Workouts", footprint_cal: "👣 Fitness Footprints", sys_settings: "⚙️ System & Settings", set_theme: "Visual Theme", set_lang: "Language", nav_punch: "Punch", nav_circle_l: "Circle", nav_rank: "Rank", nav_mine: "Me", date_lbl: "📅 Workout Date (Backdating)", streak_txt: "Streak" }
  };

  const $ = id => document.getElementById(id);
  const toast = $('toast');
  function show(msg) { toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 3000); }
  function ls(k, d) { try { let v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
  function lss(k, v) { localStorage.setItem(k, JSON.stringify(v)); }

  // 🛠️ 连续打卡智能算法 UI 渲染引擎
  function updateStreakUI() {
    let savedStreak = ls('fitmate_streak', 0);
    let savedDate = ls('fitmate_streak_date', '');
    let todayStr = new Date().toDateString();
    
    if (savedDate && savedDate !== todayStr) {
      let d1 = new Date(savedDate); d1.setHours(0,0,0,0);
      let d2 = new Date(); d2.setHours(0,0,0,0);
      let diff = Math.round((d2 - d1) / 86400000);
      if (diff > 1) { savedStreak = 0; lss('fitmate_streak', 0); } // 超过1天没打，连续记录熔断清零
    }
    let txt = I18N_DICT[currentLang]['streak_txt'] || '连续';
    let unit = currentLang === 'zh' ? '天' : 'Days';
    $('mainStreakBadge').textContent = `🔥 ${txt} ${savedStreak} ${unit}`;
  }

  // 🛠️ 触发连续打卡数据进位审计
  function handleStreakIncrement() {
    let todayStr = new Date().toDateString();
    let savedDate = ls('fitmate_streak_date', '');
    let savedStreak = ls('fitmate_streak', 0);
    
    if (savedDate !== todayStr) {
      let d1 = new Date(savedDate); d1.setHours(0,0,0,0);
      let d2 = new Date(); d2.setHours(0,0,0,0);
      let diff = savedDate ? Math.round((d2 - d1) / 86400000) : 999;
      
      if (diff === 1) { savedStreak += 1; } // 正好跨越1天，连击+1
      else { savedStreak = 1; } // 断档或首次打卡，重置为1天
      
      lss('fitmate_streak', savedStreak);
      lss('fitmate_streak_date', todayStr);
    }
    updateStreakUI();
  }

  function applyLanguage(lang) {
    currentLang = lang; let d = I18N_DICT[lang];
    var t = (id, k) => { if($(id)) $(id).textContent = d[k]; };
    t('lblAuthTitle', 'logo_title'); t('lblAuthSub', 'logo_sub'); t('lblSelectSport', 'select_sport'); t('lblTodayMood', 'today_mood'); t('lblPrivSelf', 'priv_self'); t('lblPrivAll', 'priv_all'); t('lblTabCircle', 'nav_circle_l'); t('lblRep1', 'rep_1'); t('lblRep2', 'rep_2'); t('lblRep3', 'rep_3'); t('lblStatHours', 'stat_hours'); t('lblStatTimes', 'stat_times'); t('lblFootprintCal', 'footprint_cal'); t('lblSysSettings', 'sys_settings'); t('lblSetTheme', 'set_theme'); t('lblSetLang', 'set_lang'); t('lblCheckinDate', 'date_lbl');
    let navs = document.querySelectorAll('.bottom-nav .nav-item');
    if(navs.length >= 4) { navs[0].querySelector('.nav-lbl').textContent = d['nav_punch']; navs[1].querySelector('.nav-lbl').textContent = d['nav_circle_l']; navs[2].querySelector('.nav-lbl').textContent = d['nav_rank']; navs[3].querySelector('.nav-lbl').textContent = d['nav_mine']; }
    $('btnToggleLang').textContent = lang === 'zh' ? 'English' : '中文';
    updateStreakUI();
  }

  async function updateNickname() {
    let newName = $('newNickname').value.trim();
    if (!newName || newName === nickname) return show('请输入不同的新昵称');
    show('正在同步云端历史...');
    const { error } = await supabase.from('fitmate_posts').update({ username: newName }).eq('username', nickname);
    if (error) return show('同步失败：' + error.message);
    nickname = newName; lss('fitmate_nickname', newName);
    $('topName').textContent = newName; if($('mineName')) $('mineName').textContent = newName;
    $('newNickname').value = ''; show('🎉 昵称及历史动态已全部更新！'); renderCircle();
  }

  async function renderPersonalCenter() {
    $('mineName').textContent = nickname; $('mineAvatar').textContent = selectedAvatar;
    const { data } = await supabase.from('fitmate_posts').select('*').eq('username', nickname);
    
    let totalDur = 0, totalCount = data ? data.length : 0;
    if (data) data.forEach(p => { if (p.exercise_data && p.exercise_data.duration) totalDur += parseFloat(p.exercise_data.duration); });
    $('statDuration').textContent = totalDur; $('statCounts').textContent = totalCount;

    let now = new Date(); let currYear = now.getFullYear(); let currMonth = now.getMonth();
    let daysInMonth = new Date(currYear, currMonth + 1, 0).getDate();
    let monthStr = `${currYear}.${String(currMonth + 1).padStart(2, '0')}`;
    
    let titlePrefix = currentLang === 'zh' ? '👣 运动足迹日历' : '👣 Fitness Footprints';
    $('lblFootprintCal').textContent = `${titlePrefix} (${monthStr})`;

    const cal = $('calendarGrid'); cal.innerHTML = '';
    let checkedDays = [];
    if(data) data.forEach(p => {
      let pDate = new Date(p.created_at);
      if (pDate.getFullYear() === currYear && pDate.getMonth() === currMonth) {
        let d = pDate.getDate(); if(checkedDays.indexOf(d) === -1) checkedDays.push(d);
      }
    });
    
    for(let i=1; i<=daysInMonth; i++) {
      let d = document.createElement('div');
      let isChecked = checkedDays.indexOf(i) !== -1;
      d.className = `py-1 text-center rounded text-[10px] ${isChecked ? 'bg-lime-400 text-gray-900 font-black border border-lime-300' : 'bg-gray-700/40 text-gray-500'}`;
      d.textContent = isChecked ? '💪' : i; cal.appendChild(d);
    }
  }

  async function renderRankings() {
    $('rankList').innerHTML = '<div class="text-center text-gray-500 py-6 text-xs">🌐 正在对账当月数据...</div>';
    const { data } = await supabase.from('fitmate_posts').select('*');
    if (!data) return;
    let agg = {};
    let now = new Date(); let currYear = now.getFullYear(); let currMonth = now.getMonth();

    data.forEach(p => {
      let pDate = new Date(p.created_at);
      if (pDate.getFullYear() === currYear && pDate.getMonth() === currMonth) {
        let u = p.username || '匿名';
        if(!agg[u]) agg[u] = { name: u, avatar: p.avatar || '🏃', duration: 0, count: 0, runDistance: 0 };
        agg[u].count += 1;
        let ed = p.exercise_data || {};
        if(ed.duration) agg[u].duration += parseFloat(ed.duration);
        if(ed.name === '跑步' && ed.distance) agg[u].runDistance += parseFloat(ed.distance);
      }
    });
    
    let list = Object.values(agg);
    if(activeReport === '3.1') list.sort((a,b) => b.duration - a.duration);
    else if(activeReport === '3.2') list.sort((a,b) => b.count - a.count);
    else list.sort((a,b) => b.runDistance - a.runDistance);
    
    let h = '';
    list.forEach((row, idx) => {
      let score = row.duration + ' 分钟';
      if(activeReport === '3.2') score = row.count + ' 次';
      if(activeReport === '3.3') score = row.runDistance.toFixed(1) + ' 公里';
      h += `<div class="flex items-center justify-between text-xs py-2 border-b border-gray-600/20"><div class="flex items-center gap-2"><span class="text-gray-400 font-bold w-4">${idx+1}</span><div class="w-6 h-6 bg-gray-600 rounded-full flex items-center justify-center">${row.avatar}</div><span class="text-white">${row.name}</span></div><span class="text-lime-400 font-bold font-mono">${score}</span></div>`;
    });
    $('rankList').innerHTML = h || '<div class="text-center text-gray-500 py-6 text-xs">当月暂无动态</div>';
  }

  function switchToMain() { $('auth-screen').classList.add('hidden'); $('main-screen').classList.add('active'); renderSports(); renderCircle(); updateStreakUI(); }

  function renderSports() {
    const grid = $('sportGrid'); grid.innerHTML = '';
    ALL_SPORTS.forEach(s => {
      let div = document.createElement('div');
      div.className = 'sport-item'; div.innerHTML = `<span class="block text-xl">${s.emoji}</span><span class="text-[10px] text-gray-400">${s.name}</span>`;
      div.onclick = () => {
        document.querySelectorAll('.sport-item').forEach(el => el.classList.remove('selected'));
        div.classList.add('selected'); selectedSport = s; selectedBodyPart = null;
        $('dynamicFormCard').style.display = 'block'; $('extraCard').style.display = 'block';
        buildForm(s);
      };
      grid.appendChild(div);
    });
  }

  function buildForm(s) {
    const cont = $('dynamicFormContent'); cont.innerHTML = '';
    if (s.type === 'distance') {
      cont.innerHTML = `<div class="flex gap-2"><input type="number" class="form-input dur text-xs" placeholder="⏱ 时长 (分钟)" /><input type="number" class="form-input dist text-xs" placeholder="📏 距离 (公里)" /></div>`;
    } else if (s.type === 'anaerobic') {
      let h = '<div class="body-part-tabs" id="bodyTabs">'; 
      BODY_PARTS.forEach(bp => h += `<div class="body-part-tab" data-part="${bp.id}">${bp.label}</div>`);
      h += '</div><input type="number" class="form-input dur text-xs" placeholder="⏱ 时长 (分钟)" />'; cont.innerHTML = h;
      cont.querySelectorAll('.body-part-tab').forEach(tab => {
        tab.onclick = () => {
          cont.querySelectorAll('.body-part-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active'); selectedBodyPart = tab.dataset.part; validate();
        };
      });
    } else {
      cont.innerHTML = `<input type="number" class="form-input dur text-xs" placeholder="⏱ 时长 (分钟)" />`;
    }
    cont.querySelectorAll('input').forEach(i => i.oninput = validate);
    validate();
  }

  function validate() {
    let ok = true; let dInput = document.querySelector('.dur'); if(!dInput || !dInput.value.trim() || parseFloat(dInput.value) <= 0) ok = false;
    if(selectedSport && selectedSport.type === 'distance') { let distInput = document.querySelector('.dist'); if(!distInput || !distInput.value.trim() || parseFloat(distInput.value) <= 0) ok = false; }
    if(selectedSport && selectedSport.type === 'anaerobic' && !selectedBodyPart) ok = false;
    $('btnConfirmCheckin').disabled = !ok;
  }

  function resetForm() {
    selectedSport = null; selectedBodyPart = null; selectedMood = '😄'; isPrivate = false;
    $('dynamicFormCard').style.display = 'none'; $('extraCard').style.display = 'none';
    document.querySelectorAll('.sport-grid .sport-item').forEach(el => el.classList.remove('selected'));
    document.querySelectorAll('.mood-grid .mood-item').forEach(el => el.classList.remove('selected'));
    let m = document.querySelector('[data-mood="😄"]'); if(m) m.classList.add('selected');
    $('privacyToggle').classList.add('active'); initDatePicker(); validate();
  }

  async function renderCircle() {
    $('circleFeed').innerHTML = '<div class="text-center text-gray-500 py-10 text-xs">🌐 正在对账云端动态...</div>';
    const { data } = await supabase.from('fitmate_posts').select('*').order('created_at', { ascending: false }).limit(50);
    if (!data || data.length === 0) return $('circleFeed').innerHTML = '<div class="text-center text-gray-500 py-10 text-xs">暂无动态</div>';
    let h = '';
    data.forEach(p => {
      let ed = p.exercise_data || {}; let likesArr = p.likes || []; let commsArr = p.comments || []; let isLiked = likesArr.indexOf(nickname) !== -1;
      h += `<div class="post-card" data-pid="${p.id}">
        <div class="post-header">
          <div class="post-avatar">${p.avatar||'🏃'}</div>
          <div><div class="text-white text-xs font-bold">${p.username}</div><div class="text-[10px] text-gray-500">${p.created_at.slice(5,16).replace('T',' ')}</div></div>
        </div>
        <div class="text-lime-400 text-xs font-bold mb-1">${ed.emoji || '🏋️'} ${ed.name || '运动'}</div>
        <div class="text-gray-300 text-xs">⏱ 时长：${ed.duration || 0} 分钟 ${ed.distance ? `| 📏 距离：${ed.distance} 公里` : ''} ${ed.bodyPart ? `| 🏋️ 部位：${ed.bodyPart}` : ''} | 心情 ${p.mood || '😄'}</div>
        <div class="flex gap-6 mt-3 pt-2 border-t border-gray-600/30 text-xs text-gray-400">
          <div class="cursor-pointer flex items-center gap-1 act-like ${isLiked ? 'text-red-400 font-bold' : ''}"><span>${isLiked ? '❤️' : '🤍'}</span> 点赞 ${likesArr.length}</div>
          <div class="flex items-center gap-1"><span>💬</span> 评论 ${commsArr.length}</div>
        </div>`;
      if(commsArr.length > 0) {
        h += `<div class="mt-2 bg-gray-800/40 p-2 rounded-lg flex flex-col gap-1 text-[11px]">`;
        commsArr.forEach(c => { h += `<div class="text-gray-300"><span class="text-lime-400 font-bold">${c.author}</span>: ${c.text}</div>`; });
        h += `</div>`;
      }
      h += `<div class="mt-2 flex gap-2">
        <input class="flex-1 bg-gray-600 rounded-lg p-1.5 text-xs text-white outline-none comm-input" type="text" placeholder="说点什么..." />
        <button class="bg-lime-400 text-gray-900 px-3 py-1 rounded-lg text-xs font-bold btn-send-comm">发送</button>
      </div></div>`;
    });
    $('circleFeed').innerHTML = h; bindCircleEvents();
  }

  function bindCircleEvents() {
    document.querySelectorAll('.post-card').forEach(card => {
      let pid = card.dataset.pid;
      card.querySelector('.act-like').onclick = async () => {
        const { data } = await supabase.from('fitmate_posts').select('likes').eq('id', pid).single(); if(!data) return;
        let lk = data.likes || []; let idx = lk.indexOf(nickname);
        if(idx === -1) lk.push(nickname); else lk.splice(idx, 1);
        await supabase.from('fitmate_posts').update({ likes: lk }).eq('id', pid); renderCircle();
      };
      card.querySelector('.btn-send-comm').onclick = async () => {
        let input = card.querySelector('.comm-input'); let val = input.value.trim(); if(!val) return;
        const { data } = await supabase.from('fitmate_posts').select('comments').eq('id', pid).single(); if(!data) return;
        let cm = data.comments || []; cm.push({ id: Date.now(), author: nickname, text: val });
        await supabase.from('fitmate_posts').update({ comments: cm }).eq('id', pid); input.value = ''; renderCircle();
      };
    });
  }

  function initDatePicker() {
    const today = new Date(); const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0'); const dd = String(today.getDate()).padStart(2, '0');
    $('checkinDate').value = `${yyyy}-${mm}-${dd}`;
  }

  $('btnStart').onclick = () => {
    nickname = $('nickname').value.trim(); if (!nickname) return;
    lss('fitmate_nickname', nickname); lss('fitmate_avatar', selectedAvatar);
    $('topAvatar').textContent = selectedAvatar; $('topName').textContent = nickname;
    switchToMain();
  };

  $('nickname').oninput = function() { $('btnStart').disabled = !this.value.trim(); };
  $('btnUpdateName').onclick = updateNickname;

  $('btnConfirmCheckin').onclick = async function() {
    if(this.disabled) return;
    let dInput = document.querySelector('.dur'); let dur = dInput ? dInput.value : 0;
    let distInput = document.querySelector('.dist'); let dist = distInput ? distInput.value : 0;
    let ed = { name: selectedSport.name, emoji: selectedSport.emoji, duration: dur, type: selectedSport.type };
    if(selectedSport.type === 'distance') ed.distance = dist;
    if(selectedSport.type === 'anaerobic') ed.bodyPart = selectedBodyPart;
    
    let userSelectedDate = $('checkinDate').value; let parts = userSelectedDate.split('-'); let t = new Date();
    let finalDate = new Date(parts[0], parts[1] - 1, parts[2], t.getHours(), t.getMinutes(), t.getSeconds());
    let finalTimestamp = finalDate.toISOString();

    const post = { username: nickname, avatar: selectedAvatar, exercise_type: selectedSport.type, exercise_data: ed, mood: selectedMood, is_public: !isPrivate, likes: [], comments: [], created_at: finalTimestamp };
    show('🚀 正在上传云端...');
    await supabase.from('fitmate_posts').insert([post]);
    
    // 🛠️ 焊接点通：打卡完成，瞬间呼叫连续打卡天数累计引擎
    handleStreakIncrement();
    
    show('🎉 打卡成功！天数已即时连击');
    resetForm(); renderCircle();
  };

  document.querySelectorAll('.avatar-option').forEach(el => {
    el.onclick = () => {
      document.querySelectorAll('.avatar-option').forEach(a => a.classList.remove('selected'));
      el.classList.add('selected'); selectedAvatar = el.dataset.avatar;
    };
  });

  document.querySelectorAll('.mood-item').forEach(el => {
    el.onclick = () => {
      document.querySelectorAll('.mood-item').forEach(m => m.classList.remove('selected'));
      el.classList.add('selected'); selectedMood = el.dataset.mood;
    };
  });

  document.querySelectorAll('.nav-item').forEach(item => {
    item.onclick = () => {
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active')); item.classList.add('active');
      document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
      let tab = item.dataset.tab; $(`page-${tab}`).classList.add('active');
      if (tab === 'circle') renderCircle(); if (tab === 'rank') renderRankings(); if (tab === 'mine') renderPersonalCenter();
    };
  });

  document.querySelectorAll('#rankTabs button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#rankTabs button').forEach(b => { b.classList.remove('active','bg-lime-400','text-gray-900'); b.classList.add('bg-gray-700','text-white'); });
      btn.classList.remove('bg-gray-700','text-white'); btn.classList.add('active','bg-lime-400','text-gray-900');
      activeReport = btn.dataset.rep; renderRankings();
    };
  });

  $('privacyToggle').onclick = function() { this.classList.toggle('active'); isPrivate = !this.classList.contains('active'); };
  $('btnToggleTheme').onclick = () => {
    let app = $('app'); if (currentTheme === 'dark') { currentTheme = 'light'; app.classList.add('light-theme-active'); } else { currentTheme = 'dark'; app.classList.remove('light-theme-active'); }
  };

  $('btnToggleLang').onclick = () => {
    if (currentLang === 'zh') applyLanguage('en'); else applyLanguage('zh');
    if($('page-mine').classList.contains('active')) renderPersonalCenter();
  };

  (async function init() {
    initDatePicker(); applyLanguage('zh');
    let saved = ls('fitmate_nickname', '');
    if (saved) {
      nickname = saved; selectedAvatar = ls('fitmate_avatar', '🏃');
      $('topName').textContent = nickname; $('topAvatar').textContent = selectedAvatar;
      switchToMain();
    }
  })();
})();
</script>
</body>
</html>
